<svg id="svg-root" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Mango: cromo/plata neutra -->
    <linearGradient id="g-kmic-handle" x1="9.9" y1="0" x2="14.1" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#464646" />
      <stop offset="20%" stop-color="#9E9E9E" />
      <stop offset="42%" stop-color="#F5F5F5" />
      <stop offset="68%" stop-color="#B8B8B8" />
      <stop offset="100%" stop-color="#535353" />
    </linearGradient>
    <!-- Collar -->
    <linearGradient id="g-kmic-collar" x1="9.1" y1="0" x2="14.9" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#424242" />
      <stop offset="25%" stop-color="#CCCCCC" />
      <stop offset="48%" stop-color="#FFFFFF" />
      <stop offset="72%" stop-color="#A7A7A7" />
      <stop offset="100%" stop-color="#3B3B3B" />
    </linearGradient>
    <!-- Cabeza de malla: grafito neutro -->
    <radialGradient id="rg-kmic-ball" cx="10.6" cy="4.5" r="7" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A6A6A6" />
      <stop offset="35%" stop-color="#606060" />
      <stop offset="75%" stop-color="#2C2C2C" />
      <stop offset="100%" stop-color="#131313" />
    </radialGradient>
    <radialGradient id="rg-kmic-spec" cx="10.5" cy="4.3" r="1.9" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="rg-kmic-glow" cx="50%" cy="48%" r="52%">
      <stop offset="0%" stop-color="#E8E8E8" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#B8B8B8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#838383" stop-opacity="0" />
    </radialGradient>
    <pattern id="p-kmic-mesh" width="1.05" height="1.05" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0H1.05M0 0V1.05" stroke="#080808" stroke-width="0.17" />
    </pattern>
    <clipPath id="c-kmic-ball">
      <circle cx="12" cy="6" r="4.2" />
    </clipPath>
    <filter id="f-kmic-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.4" stdDeviation="0.35" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <circle cx="12" cy="12" r="11.5" fill="url(#rg-kmic-glow)" />

  <g filter="url(#f-kmic-shadow)">
    <g transform="rotate(32 12 12)">
      <!-- Mango cónico -->
      <path d="M9.9 11.2H14.1L13.2 20.5Q13.1 21.6 12 21.6Q10.9 21.6 10.8 20.5Z" fill="url(#g-kmic-handle)" />
      <!-- Banda del interruptor -->
      <rect x="10.15" y="13.6" width="3.7" height="2.1" rx="0.5" fill="#181818" />
      <rect x="11.2" y="14.05" width="1.6" height="1.2" rx="0.6" fill="#DCDCDC" />
      <rect x="11.45" y="14.2" width="0.7" height="0.4" rx="0.2" fill="#FFFFFF" opacity="0.8" />
      <!-- Remate inferior -->
      <path d="M10.85 20.1H13.15" stroke="#3D3D3D" stroke-width="0.3" stroke-linecap="round" opacity="0.8" />
      <!-- Brillo lateral -->
      <path d="M10.55 12L11.05 20" stroke="#FFFFFF" stroke-width="0.3" stroke-linecap="round" opacity="0.5" />

      <!-- Cabeza de malla -->
      <circle cx="12" cy="6" r="4.2" fill="url(#rg-kmic-ball)" />
      <g clip-path="url(#c-kmic-ball)">
        <rect x="7.5" y="1.5" width="9" height="9" fill="url(#p-kmic-mesh)" opacity="0.55" />
        <circle cx="10.5" cy="4.3" r="1.9" fill="url(#rg-kmic-spec)" />
      </g>
      <circle cx="12" cy="6" r="4.2" stroke="#CCCCCC" stroke-width="0.3" opacity="0.8" />

      <!-- Collar -->
      <rect x="9.1" y="9.95" width="5.8" height="1.6" rx="0.8" fill="url(#g-kmic-collar)" />
      <path d="M9.5 10.05H14.5" stroke="#FFFFFF" stroke-width="0.25" stroke-linecap="round" opacity="0.6" />
      <path d="M9.5 11.35H14.5" stroke="#303030" stroke-width="0.25" stroke-linecap="round" opacity="0.55" />
    </g>
  </g>

  <!-- Destello -->
  <path d="M5.4 3.6L5.8 4.9L7.1 5.3L5.8 5.7L5.4 7L5 5.7L3.7 5.3L5 4.9Z" fill="#F5F5F5" opacity="0.9" />
</svg>