name: CSS scope lint

on:
  push:
  pull_request:

jobs:
  css-scope-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check skin and surface selector scopes
        run: npm run lint:scopes
