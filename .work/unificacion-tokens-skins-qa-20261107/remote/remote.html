<!DOCTYPE html>
<!--
  remote.html — Mando remoto móvil de AuraPlay Pro
  ---------------------------------------------------------------------------
  Página ligera solo para el teléfono: no carga el reproductor ni visualizadores.
  Estilos: ./remote.css · Lógica: ./remoteClient.js (WebSocket hacia la PC).

  Se abre desde el QR del reproductor, con este formato:
    remote.html?ws=<url del relay codificada>&session=<clave>

  CONTRATO CON remoteClient.js
    Los IDs de este archivo (connectionStatus, seek, btnPlayPause, volume…) los usa
    el script para actualizar el DOM. No los renombres sin cambiar DOM_IDS allí.
    El icono .pause-icon de btnPlayPause empieza oculto (style="display:none");
    el script alterna .play-icon / .pause-icon por sí solo.
-->
<html lang="es" data-theme="dark">
<head>
  <style>@layer base, theme, skin, surface, finish;</style>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0a1316" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#eef3f2" media="(prefers-color-scheme: light)">
  <!-- La URL lleva la clave de sesión: que no viaje en la cabecera Referer. -->
  <meta name="referrer" content="no-referrer">
  <title>AuraPlay · Mando remoto</title>
  <link rel="stylesheet" href="./remote.css?v=5">
  <script src="./remoteClient.js?v=3" defer></script>
</head>
<body>
  <main class="remote">

    <header class="topbar">
      <div id="connectionStatus" class="status" data-state="disconnected" role="status" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="connectionLabel">Sin conectar</span>
      </div>
      <button id="btnTheme" class="btn btn-theme" type="button" aria-label="Cambiar a tema claro" title="Cambiar a tema claro">
        <svg id="theme-sun" class="icon icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>
        <svg id="theme-moon" class="icon icon-stroke" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M20.9 13A9 9 0 0 1 11 3.1 9 9 0 1 0 20.9 13Z"/></svg>
      </button>
    </header>

    <section class="now" aria-label="Pista actual">
      <div class="art" aria-hidden="true">
        <img id="track-cover" class="track-cover" alt="" hidden>
        <svg class="icon icon-stroke" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <div class="info">
        <p id="playbackState" class="state">En espera</p>
        <h1 id="track-title" class="title">Elige una canción</h1>
        <p id="track-artist" class="artist">Tu música aparecerá aquí</p>
      </div>
      <section class="lyric-panel" aria-label="Letra actual" hidden><p id="currentLyric" class="current-lyric" aria-live="polite" aria-atomic="true"></p></section>
    </section>

    <section class="progress" aria-label="Progreso">
      <input id="seek" class="range" type="range" min="0" max="100" step="0.1" value="0"
             aria-label="Posición de reproducción" aria-valuetext="0:00 de 0:00" disabled>
      <div class="times">
        <span id="elapsed">0:00</span>
        <span id="duration">0:00</span>
      </div>
    </section>

    <div class="transport" role="group" aria-label="Controles de reproducción">
      <button id="btnPrevious" class="btn btn-skip" type="button" aria-label="Pista anterior" title="Pista anterior" disabled>
        <svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2.5v12H6zM19 6v12L10 12z"/></svg>
      </button>

      <button id="btnPlayPause" class="btn btn-play" type="button" aria-label="Reproducir" title="Reproducir" disabled>
        <svg class="icon icon-fill play-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon icon-fill pause-icon" viewBox="0 0 24 24" aria-hidden="true" style="display:none"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>

      <button id="btnNext" class="btn btn-skip" type="button" aria-label="Pista siguiente" title="Pista siguiente" disabled>
        <svg class="icon icon-fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 6H18v12h-2.5zM5 6l9 6-9 6z"/></svg>
      </button>
    </div>

    <div class="modes">
      <button id="btnShuffle" class="btn btn-mode" type="button" aria-pressed="false"
              aria-label="Aleatorio: desactivado" title="Aleatorio: desactivado" disabled>
        <svg class="icon icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
        <span>Aleatorio</span>
      </button>

      <button id="btnRepeat" class="btn btn-mode" type="button" data-mode="off" aria-pressed="false"
              aria-label="Repetición: desactivada" title="Repetición: desactivada" disabled>
        <span class="icon-wrap">
          <svg class="icon icon-stroke" viewBox="0 0 24 24" aria-hidden="true"><path d="m17 1 4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/></svg>
          <span class="badge" aria-hidden="true">1</span>
        </span>
        <span id="repeatLabel">Repetir: no</span>
      </button>
    </div>

    <div class="volume-row">
      <button id="btnMute" class="btn btn-mute" type="button" aria-pressed="false"
              aria-label="Silenciar" title="Silenciar" disabled>
        <svg class="icon icon-stroke volume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
        <svg class="icon icon-stroke mute-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5 6 9H2v6h4l5 4zM23 9l-6 6M17 9l6 6"/></svg>
      </button>
      <input id="volume" class="range" type="range" min="0" max="100" step="1" value="70"
             aria-label="Volumen" aria-valuetext="70%" disabled>
      <span id="volumeValue" class="volume-value">70%</span>
    </div>

    <footer class="foot">
      <p id="connectionHelp">Abre AuraPlay en tu dispositivo principal para comenzar.</p>
    </footer>

    <noscript><p class="foot">Activa JavaScript para usar el mando remoto.</p></noscript>
  </main>
</body>
</html>
