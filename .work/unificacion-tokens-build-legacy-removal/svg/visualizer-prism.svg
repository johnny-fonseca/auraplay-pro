<svg id="svg-root" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
<defs>
        <!-- ══ Metales premium (5-6 paradas) ══ -->
        <linearGradient id="pm-gold" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F4F4F4" />
          <stop offset="18%" stop-color="#D7D7D7" />
          <stop offset="42%" stop-color="#B1B1B1" />
          <stop offset="62%" stop-color="#949494" />
          <stop offset="82%" stop-color="#BDBDBD" />
          <stop offset="100%" stop-color="#6E6E6E" />
        </linearGradient>
        <linearGradient id="pm-gold-v" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#F4F4F4" />
          <stop offset="40%" stop-color="#CBCBCB" />
          <stop offset="100%" stop-color="#6E6E6E" />
        </linearGradient>
        <linearGradient id="pm-silver" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" />
          <stop offset="22%" stop-color="#E3E3E3" />
          <stop offset="46%" stop-color="#B1B1B1" />
          <stop offset="68%" stop-color="#959595" />
          <stop offset="86%" stop-color="#D1D1D1" />
          <stop offset="100%" stop-color="#6F6F6F" />
        </linearGradient>
        <linearGradient id="pm-silver-v" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#F0F0F0" />
          <stop offset="100%" stop-color="#6B6B6B" />
        </linearGradient>
        <linearGradient id="pm-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E3E3E3" />
          <stop offset="28%" stop-color="#B8B8B8" />
          <stop offset="58%" stop-color="#949494" />
          <stop offset="100%" stop-color="#525252" />
        </linearGradient>
        <linearGradient id="pm-blue" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#CECECE" />
          <stop offset="30%" stop-color="#939393" />
          <stop offset="68%" stop-color="#666666" />
          <stop offset="100%" stop-color="#373737" />
        </linearGradient>
        <linearGradient id="pm-violet" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#BDBDBD" />
          <stop offset="35%" stop-color="#848484" />
          <stop offset="70%" stop-color="#555555" />
          <stop offset="100%" stop-color="#303030" />
        </linearGradient>
        <linearGradient id="pm-rose" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#C3C3C3" />
          <stop offset="40%" stop-color="#8E8E8E" />
          <stop offset="75%" stop-color="#636363" />
          <stop offset="100%" stop-color="#353535" />
        </linearGradient>
        <linearGradient id="pm-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E4E4E4" />
          <stop offset="40%" stop-color="#C4C4C4" />
          <stop offset="75%" stop-color="#8D8D8D" />
          <stop offset="100%" stop-color="#595959" />
        </linearGradient>

        <!-- ══ Rim-lights direccionales ══ -->
        <linearGradient id="rim-top" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>
        <linearGradient id="rim-bottom" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
          <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
        </linearGradient>

        <!-- ══ Glow radiales refinados ══ -->
        <radialGradient id="pg-gold-glow" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#F4F4F4" stop-opacity="0.5" />
          <stop offset="45%" stop-color="#D7D7D7" stop-opacity="0.18" />
          <stop offset="100%" stop-color="#6E6E6E" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="pg-cyan-glow" cx="50%" cy="40%" r="55%">
          <stop offset="0%" stop-color="#E3E3E3" stop-opacity="0.45" />
          <stop offset="100%" stop-color="#525252" stop-opacity="0" />
        </radialGradient>

        <!-- ══ Filtros premium ══ -->
        <filter id="pf-ambient" x="-20%" y="-20%" width="140%" height="140%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="0.4" />
          <feOffset dx="0" dy="0.6" result="ao" />
          <feFlood flood-color="#000000" flood-opacity="0.35" />
          <feComposite in2="ao" operator="in" result="shadow" />
          <feMerge>
            <feMergeNode in="shadow" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="pf-rim" x="-15%" y="-15%" width="130%" height="130%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="0.3" result="blur" />
          <feSpecularLighting
            in="blur"
            surfaceScale="2"
            specularConstant="0.9"
            specularExponent="18"
            result="spec"
          >
            <fePointLight x="6" y="2" z="8" />
          </feSpecularLighting>
          <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip" />
          <feMerge>
            <feMergeNode in="SourceGraphic" />
            <feMergeNode in="specClip" />
          </feMerge>
        </filter>
        <filter id="pf-glow-gold" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="b" />
          <feFlood flood-color="#D7D7D7" flood-opacity="0.55" />
          <feComposite in2="b" operator="in" result="g" />
          <feMerge>
            <feMergeNode in="g" />
            <feMergeNode in="g" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="pf-glow-cyan" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="1.8" result="b" />
          <feFlood flood-color="#B8B8B8" flood-opacity="0.5" />
          <feComposite in2="b" operator="in" result="g" />
          <feMerge>
            <feMergeNode in="g" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="pf-glow-violet" x="-60%" y="-60%" width="220%" height="220%">
          <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="b" />
          <feFlood flood-color="#848484" flood-opacity="0.5" />
          <feComposite in2="b" operator="in" result="g" />
          <feMerge>
            <feMergeNode in="g" />
            <feMergeNode in="SourceGraphic" />
          </feMerge>
        </filter>
        <filter id="pf-texture">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="noise" />
          <feColorMatrix in="noise" type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.06" />
          </feComponentTransfer>
          <feComposite in2="SourceGraphic" operator="in" result="grain" />
          <feMerge>
            <feMergeNode in="SourceGraphic" />
            <feMergeNode in="grain" />
          </feMerge>
        </filter>
      </defs>
                    <defs>
                      <linearGradient id="g-pr-face-a" x1="12" y1="3" x2="12" y2="21">
                        <stop offset="0%" stop-color="#F0F0F0" stop-opacity="0.5" />
                        <stop offset="100%" stop-color="#5B5B5B" stop-opacity="0.2" />
                      </linearGradient>
                      <linearGradient id="g-pr-face-b" x1="3" y1="12" x2="21" y2="12">
                        <stop offset="0%" stop-color="#D1D1D1" stop-opacity="0.45" />
                        <stop offset="100%" stop-color="#4B4B4B" stop-opacity="0.15" />
                      </linearGradient>
                      <linearGradient id="g-pr-rainbow" x1="15" y1="6" x2="22" y2="18">
                        <stop offset="0%" stop-color="#8A8A8A" />
                        <stop offset="20%" stop-color="#B4B4B4" />
                        <stop offset="40%" stop-color="#D7D7D7" />
                        <stop offset="60%" stop-color="#C4C4C4" />
                        <stop offset="80%" stop-color="#939393" />
                        <stop offset="100%" stop-color="#848484" />
                      </linearGradient>
                    </defs>
                    <line x1="2" y1="12" x2="9" y2="12" stroke="url(#pm-silver)" stroke-width="1.3" opacity="0.55" stroke-linecap="round" />
                    <path d="M12 3l3 9-3 9-3-9 3-9Z" fill="url(#g-pr-face-a)" stroke="#B1B1B1" stroke-width="0.5" opacity="0.75" />
                    <path d="M3 12l9-3 9 3-9 3-9-3Z" fill="url(#g-pr-face-b)" stroke="#B1B1B1" stroke-width="0.5" opacity="0.65" />
                    <line x1="12" y1="3" x2="15" y2="12" stroke="#FFFFFF" stroke-width="0.35" opacity="0.3" />
                    <line x1="12" y1="3" x2="9" y2="12" stroke="#FFFFFF" stroke-width="0.25" opacity="0.25" />
                    <line x1="15" y1="12" x2="22" y2="7" stroke="url(#g-pr-rainbow)" stroke-width="0.9" opacity="0.65" stroke-linecap="round" />
                    <line x1="15" y1="12" x2="22" y2="10" stroke="#8A8A8A" stroke-width="0.55" opacity="0.45" stroke-linecap="round" />
                    <line x1="15" y1="12" x2="22" y2="12" stroke="#D7D7D7" stroke-width="0.55" opacity="0.45" stroke-linecap="round" />
                    <line x1="15" y1="12" x2="22" y2="14" stroke="#C4C4C4" stroke-width="0.55" opacity="0.45" stroke-linecap="round" />
                    <line x1="15" y1="12" x2="22" y2="17" stroke="#848484" stroke-width="0.55" opacity="0.45" stroke-linecap="round" />
                    <circle cx="12" cy="12" r="0.9" fill="#FFFFFF" opacity="0.2" />
                  </svg>
